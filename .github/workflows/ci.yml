name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: wedding_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wedding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUSKY: 0
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/wedding_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Typecheck, build, test and check formatting
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          bun run test
          bun run format:check
      - name: Build and start production image
        run: |
          docker build -t wedding-picture-uploader:ci --build-arg WEDDING_PICTURE_UPLOADER_REVISION="$GITHUB_SHA" .
          trap 'docker logs wedding-picture-uploader-ci; docker rm -f wedding-picture-uploader-ci' EXIT
          docker run -d --name wedding-picture-uploader-ci --network host \
            -e DATABASE_URL="$TEST_DATABASE_URL" -e UPLOADTHING_TOKEN=ci \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            wedding-picture-uploader:ci
          for _attempt in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' wedding-picture-uploader-ci)" = healthy ] && break
            sleep 2
          done
          curl --fail --silent --show-error --dump-header - http://127.0.0.1:3000/healthz \
            | tee /dev/stderr | grep -qi "^x-wedding-picture-uploader-revision: $GITHUB_SHA"

  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: wedding_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wedding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUSKY: 0
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/wedding_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: HUSKY=0 bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: |
          set -o pipefail
          mkdir -p artifacts/e2e-ci
          bun run test:e2e 2>&1 | tee artifacts/e2e-ci/run.log
      - name: Save test reports and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: true
          name: e2e-evidence
          retention-days: 7
          path: |
            playwright-report/
            .artifacts/tanstack-migration/test-results/
            artifacts/e2e-ci/
